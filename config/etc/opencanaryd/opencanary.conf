{
  "device.node_id": "group04-opencanary",
  
  "ftp.enabled": true,
  "ftp.port": 2121,

  "http.enabled": true,
  "http.port": 8080,
  "http.banner": "Apache/2.4.57 (Debian)",
  "http.skin": "basicLogin",

  "telnet.enabled": true,
  "telnet.port": 2323,

  "mysql.enabled": true,
  "mysql.port": 3307,
  "mysql.banner": "5.7.42-log",

  "ssh.enabled": false,
  "tcpbanner.enabled": false,

  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "filename": "/var/log/opencanary/opencanary.log",
          "formatter": "plain"
        }
      }
    }
  }
}
