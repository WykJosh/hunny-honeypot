# ModSecurity main configuration include
# Loaded by nginx via "modsecurity_rules_file" directive

# 1. Base ModSecurity engine config (SecRuleEngine, SecRequestBodyAccess, etc.)
Include /etc/nginx/modsec/modsecurity.conf

# 2. CRS configuration (paranoia level, anomaly thresholds, etc.)
Include /opt/coreruleset/crs-setup.conf

# 3. Honeypot-specific exclusions (must come BEFORE rules)
# These let attackers reach our trap endpoints without being blocked
Include /etc/nginx/modsec/honeypot-exclusions.conf

# 4. The actual CRS ruleset (in numerical order: 901-980 plus 999)
Include /opt/coreruleset/rules/*.conf