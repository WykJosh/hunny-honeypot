# Honeypot endpoint exclusions
# These paths are INTENTIONALLY vulnerable traps — we want attacks to reach them
# so we can log behavioral intelligence. ModSecurity must let them through.

# Honeypot Layer 0: fake .env file
SecRule REQUEST_URI "@beginsWith /.env" \
    "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Honeypot Layer 1: fakeAdmin at /admin/
SecRule REQUEST_URI "@beginsWith /admin/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Old admin path that routes to fakeAdmin
SecRule REQUEST_URI "@streq /admin.php" \
    "id:1002,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Honeypot Layer 2: honeyPotAdmin at /hundred-acre-admin/
SecRule REQUEST_URI "@beginsWith /hundred-acre-admin/" \
    "id:1003,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Trap paths from robots.txt (db_backup, backups, staging, debug, api/internal, uploads/private)
SecRule REQUEST_URI "@rx ^/(db_backup|backups|staging|debug|api/internal|uploads/private)" \
    "id:1004,phase:1,pass,nolog,ctl:ruleEngine=Off"

# NOTE: The real admin path (__ADMIN_PATH__/ → /ctrl-XXXXXXXX/) is NOT excluded.
# It gets full ModSecurity protection. This is intentional defense-in-depth.

# mad-hatter.php is a honeypot page - detect and log attacks but never block
# This lets attackers interact fully while we collect intelligence
SecRule REQUEST_URI "@beginsWith /mad-hatter.php" \
    "id:9010,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=DetectionOnly,\
    msg:'Honeypot: mad-hatter.php - switching to DetectionOnly'"

# Also exclude any other honeypot interaction pages here
SecRule REQUEST_URI "@beginsWith /trap.php" \
    "id:9011,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=DetectionOnly,\
    msg:'Honeypot: trap.php - switching to DetectionOnly'"