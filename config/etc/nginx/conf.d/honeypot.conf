
# Path: /etc/nginx/conf.d/honeypot.conf

# WAF (ModSecurity v3 + OWASP CRS) is loaded globally in nginx.conf
# via load_module + modsecurity_rules_file directives.  See Section 7
# of RUNBOOK.md.

# __ADMIN_PATH__ is a placeholder that bootstrap.sh replaces
# with the random per-deployment admin path (e.g. /ctrl-7f3a9b2c).


# ---- Rate-limit zones ------------------------------------------------------
# Application-layer rate limits (NOT a packet filter; allowed by project rules)
limit_req_zone $binary_remote_addr zone=app:10m  rate=10r/s; 
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s; 

# ---- JSON access log format for Filebeat / Elasticsearch -------------------
log_format json_combined escape=json '{'
    '"@timestamp":"$time_iso8601",'
    '"source_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_time":$request_time,'
    '"server_name":"$server_name",'
    '"scheme":"$scheme"'
'}';

# ---- Default server: catch hostless / wrong-Host probes --------------------
# Anyone hitting the IP directly without a Host header gets dropped (444 =
# nginx closes the TCP connection without a response). This is connection-level
# behaviour, NOT a packet filter
server {
    listen 80 default_server;
    server_name "" _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name "" _;
    ssl_certificate     /etc/nginx/certs/group04.hp.edu.technet.howest.be.crt;
    ssl_certificate_key /etc/nginx/certs/group04.hp.edu.technet.howest.be.key;
    return 444;
}

# ---- HTTP → HTTPS redirect -------------------------------------------------
server {
    listen 80;
    server_name group04.hp.edu.technet.howest.be;
    return 301 https://$host$request_uri;
}

# ---- Main HTTPS server -----------------------------------------------------
server {
    listen 443 ssl;
    http2 on;

    listen 443 quic;
    http3 on;

    server_name group04.hp.edu.technet.howest.be;

    root /usr/share/ngnix/honeypot;
    index index.php;

    server_tokens off;            
    autoindex off;                

    # ---- TLS configuration (Howest CA-signed cert) ----
    ssl_certificate     /etc/nginx/certs/group04.hp.edu.technet.howest.be.crt;
    ssl_certificate_key /etc/nginx/certs/group04.hp.edu.technet.howest.be.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Mozilla "intermediate" cipher list (2026)
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Session cache for fast repeat handshakes
    ssl_session_cache   shared:SSL:10m; 
    ssl_session_timeout 10m; 
    ssl_session_tickets off;     

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;    
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy   "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- Logging ----
    access_log /var/log/nginx/access.json json_combined;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- Body size limits ----
    client_max_body_size 3m;          
    client_body_buffer_size 8k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # ---- HTTP method whitelist ----
    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    # ---- WAF: ModSecurity v3 + OWASP CRS ----
    # The WAF is configured globally in /etc/nginx/nginx.conf via:
    #     modsecurity on;
    #     modsecurity_rules_file /etc/nginx/modsec/main.conf;
    # No per-server directives are needed here.  See nginx/modsec/ in the
    # repo and Section 7 of RUNBOOK.md for details.

    # ---- Default rate limiting ----
    limit_req zone=app burst=20 nodelay;

    # ============================================================
    # HONEYPOT LAYER 0: fake .env file
    # ============================================================
    # Attackers probe /.env to steal config.  We serve a planted
    # decoy file containing fake credentials that lead to Layer 2.
    location = /.env {
        default_type text/plain;
        access_log /var/log/nginx/honeypot_access.json json_combined;
        try_files /.env =404;
    }

    # ============================================================
    # HONEYPOT: Trap paths from robots.txt
    # ============================================================
    # /db_backup/, /backups/, /staging/, /debug/, /api/internal/, /uploads/private/
    # All routed to trap.php which logs the attempt and returns a fake
    # Apache 403 page (different banner than nginx — looks like a misconfigured server).
    location ~ ^/(db_backup|backups|staging|debug|api/internal|uploads/private) {
        access_log /var/log/nginx/honeypot_access.json json_combined;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/ngnix/honeypot/trap.php;
        include fastcgi_params;
    }

    # ============================================================
    # HONEYPOT LAYER 1: fakeAdmin at /admin/
    # ============================================================
    # Easy to find in any scanner wordlist.  Deliberately weak (no CSRF,
    # plain Bootstrap-ish styling).  Accepts admin/admin after 3 tries.
    location /admin/ {
        access_log /var/log/nginx/honeypot_access.json json_combined;
        try_files $uri /admin/index.php?$query_string;
        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ============================================================
    # HONEYPOT LAYER 2: honeyPotAdmin at /hundred-acre-admin/
    # ============================================================
    # The deeper trap.  Has CSRF tokens, looks polished.
    # Accepts the credentials leaked in the fake .env file.
    location /hundred-acre-admin/ {
        access_log /var/log/nginx/honeypot_access.json json_combined;
        try_files $uri /hundred-acre-admin/index.php?$query_string;
        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ============================================================
    # REAL ADMIN — random hard-to-guess path
    # ============================================================
    # Path is randomized at deployment by bootstrap.sh.  The placeholder
    # __ADMIN_PATH__ is replaced with /ctrl-XXXXXXXX.
    location __ADMIN_PATH__/ {
        # Stricter rate limit on the real admin
        limit_req zone=auth burst=10 nodelay;
        try_files $uri __ADMIN_PATH__/admin.php?$query_string;
        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ============================================================
    # /admin.php (the OLD location) → fakeAdmin
    # ============================================================
    # Anyone who pokes /admin.php directly (the original well-known path)
    # gets routed to the Layer 1 honeypot.
    location = /admin.php {
        access_log /var/log/nginx/honeypot_access.json json_combined;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/ngnix/honeypot/admin/index.php;
        include fastcgi_params;
    }

    # ---- Block PHP execution in uploads ----
    location /uploads/ {
        location ~ \.php$ { return 404; }
        location ~ /\. { return 404; }
    }

    # ---- Static assets with long cache ----
    location /css/ {
        etag on;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /images/ {
        etag on;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # ---- Stricter rate limit on auth endpoints ----
    location ~ ^/(login|register)\.php$ {
        limit_req zone=auth burst=10 nodelay;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ---- Main location ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP-FPM handler ----
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Prevent the path-info "uploads.jpg/x.php" trick
        try_files $uri =404;
    }

    # ---- Block hidden files (EXCEPT .env which is the trap) ----
    location ~ /\.(?!env) {
        return 404;
    }
}
